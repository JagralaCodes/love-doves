<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Wine, matching the gate. The old green was left from the palette
         this design replaced. -->
    <meta name="theme-color" content="#5E1227" />
    <meta name="color-scheme" content="light" />
    <!-- A private invitation: the names and addresses stay out of search. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Fonts: self-hosted, preloaded so nothing reflows mid-reveal. -->
    <link
      rel="preload"
      href="/fonts/cormorant-garamond-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/pinyon-script-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/jost-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- The bismillah is the first thing above the fold. -->
    <link rel="preload" href="/fonts/amiri-subset.woff2" as="font" type="font/woff2" crossorigin />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores SVG touch icons; it needs a PNG with its own ground. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- %INVITE_*% values are filled from wedding.config.ts at build time
         (see invitationMeta in vite.config.ts). -->
    <title>%INVITE_TITLE%</title>
    <meta name="description" content="%INVITE_DESCRIPTION%" />
    <link rel="canonical" href="%INVITE_SITE_URL%/" />

    <!-- Open Graph / WhatsApp preview. The image URL must be absolute, and
         a JPEG under ~300 KB: WhatsApp silently drops larger previews. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%INVITE_NAMES%" />
    <meta property="og:title" content="%INVITE_TITLE%" />
    <meta property="og:description" content="%INVITE_DESCRIPTION%" />
    <meta property="og:url" content="%INVITE_SITE_URL%/" />
    <meta property="og:image" content="%INVITE_SITE_URL%/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%INVITE_TITLE%" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%INVITE_TITLE%" />
    <meta name="twitter:description" content="%INVITE_DESCRIPTION%" />
    <meta name="twitter:image" content="%INVITE_SITE_URL%/og.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

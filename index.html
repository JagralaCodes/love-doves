<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0F3D32" />
    <meta name="color-scheme" content="light" />

    <!-- Fonts: self-hosted, preloaded so nothing reflows mid-reveal. -->
    <link
      rel="preload"
      href="/fonts/cormorant-garamond-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/pinyon-script-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/jost-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <title>Wedding Invitation</title>
    <meta name="description" content="With the blessings of Allah, we invite you to share in our Nikah and Walima." />

    <!-- Open Graph / WhatsApp preview. Finalised in Phase 9. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Wedding Invitation" />
    <meta
      property="og:description"
      content="With the blessings of Allah, we invite you to share in our Nikah and Walima."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

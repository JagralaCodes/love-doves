<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Glowing heart">
  <title>Glowing heart</title>
  <defs>
    <!-- The bloom the heart sits in. Drawn as a real shape rather than a
         blur filter: favicons are rasterised at 16px, and filters there are
         either dropped or turn the whole mark to mush. -->
    <radialGradient id="halo" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#f4b8c6" stop-opacity=".85"/>
      <stop offset="42%" stop-color="#f4b8c6" stop-opacity=".38"/>
      <stop offset="72%" stop-color="#d4af37" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>

    <!-- Lit from the upper left, so the heart reads as rounded, not flat. -->
    <radialGradient id="face" cx="36%" cy="26%" r="82%">
      <stop offset="0%" stop-color="#ffd9e3"/>
      <stop offset="34%" stop-color="#f4b8c6"/>
      <stop offset="68%" stop-color="#c9647f"/>
      <stop offset="100%" stop-color="#9b2c4a"/>
    </radialGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5e1a4"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#a67c1f"/>
    </linearGradient>
  </defs>

  <circle cx="32" cy="30" r="31" fill="url(#halo)"/>

  <!-- The same silhouette the gate's seals and the families' knot use, so
       the tab icon is recognisably the same heart as the invitation. -->
  <g transform="translate(32 33) scale(0.30) translate(-50 -47)">
    <path
      d="M50 90 C16 65, 4 45, 4 29 C4 13, 17 4, 30 4 C39 4, 46 9, 50 17 C54 9, 61 4, 70 4 C83 4, 96 13, 96 29 C96 45, 84 65, 50 90 Z"
      fill="url(#face)"
      stroke="url(#rim)"
      stroke-width="6"
      stroke-linejoin="round"
    />
    <!-- Gloss on the upper-left lobe, where the light falls. -->
    <ellipse cx="32" cy="25" rx="13" ry="9" fill="#ffffff" opacity=".42" transform="rotate(-26 32 25)"/>
  </g>
</svg>
